<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SkillHub Studio – แอปวาดรูป</title><meta name="theme-color" content="#151816"><style>:root{--bg:#14172a;--panel:#1d2240;--line:#323a66;--tx:#eef0fb;--mu:#a0a8cf;--ac:#f4d35e;--ac2:#ff8a73}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Sarabun,"Noto Sans Thai","Leelawadee UI",Thonburi,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1{font-size:1.9rem;line-height:1.2;margin:.2em 0 .1em;letter-spacing:-.01em}h2{font-size:1.1rem;margin:1.4em 0 .4em}
.sub{color:var(--mu);margin:0 0 14px}
button,.b{min-height:44px;font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s,border-color .15s}
button:hover,.b:hover{border-color:var(--mu)}
button.on{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
button:active,.b:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hd{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.hd a{color:var(--mu);text-decoration:none;white-space:nowrap}.hd a.on{color:var(--ac)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;margin:6px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--tx);text-decoration:none;min-height:52px;align-items:center;font:inherit;width:100%;text-align:left}
a.li:hover,button.li:hover{border-color:var(--mu)}
.li span:last-child{color:var(--mu);font-size:14px;white-space:nowrap}
.ban{background:var(--ac);color:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0}
.ban button{margin-left:6px}
.lw label{display:block;color:var(--tx)}
.md{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.bx{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.bx h2{margin-top:0}.bx fieldset{border:1px solid var(--line);border-radius:12px;margin:10px 0}.bx label{display:block;padding:8px 0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ac);color:var(--bg);font-weight:600;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw;text-align:center}
#toast.s{opacity:1}
@media(prefers-reduced-motion:reduce){#toast,button,.b{transition:none}}
body>header,.hd{display:none}
body.pg{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.tab{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tab a{flex:1;text-align:center;padding:6px 0;color:var(--mu);text-decoration:none;font-size:12px;border-radius:12px}.tab a b{display:block;font-size:22px;line-height:1.2}.tab a.on{color:var(--bg);background:var(--ac);font-weight:600}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac)}
.cta{display:block;text-align:center;background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700;padding:13px;margin:12px 0}
.cta.alt{background:var(--panel);color:var(--tx);border-color:var(--line);font-weight:600}
input[type=checkbox],input[type=radio]{width:22px;height:22px;vertical-align:middle;margin-right:8px;accent-color:var(--ac)}
input[type=number]{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;min-height:44px}
.lw label,.bx label{padding:8px 0}
.hero{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:8px 0 12px}
.ring{--p:0%;width:116px;height:116px;border-radius:50%;background:conic-gradient(var(--ac) var(--p),var(--line) 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--panel)}
.ring>*{position:relative}.ring b{font-size:2rem;line-height:1}.ring span{font-size:12px;color:var(--mu)}
.hs{display:grid;gap:6px;color:var(--mu);font-size:15px}.hs b{color:var(--ac);font-size:1.25rem;margin-right:4px}.hs p{margin:0;font-size:13px}
</style>
<style>
body.lt{--bg:#f3f4fa;--panel:#ffffff;--line:#c9cde3;--tx:#1a1d33;--mu:#555c80;--ac:#b8860b;--ac2:#d1543f}
.wrap{max-width:980px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero{margin:14px 0}.hero .goal{margin:0;font-size:13px;color:var(--mu);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin:10px 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .th{display:block;width:100%;aspect-ratio:4/3;background:#fff repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0 0/16px 16px;border:0;padding:0;border-radius:0;cursor:pointer;position:relative}
.card .th img{width:100%;height:100%;object-fit:contain;display:block}
.card .th.empty::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:.5}
.card .meta{padding:8px 10px 2px;min-width:0}.card .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .meta small{color:var(--mu)}
.card .ac{display:flex;gap:4px;padding:6px 8px 8px}.card .ac button{flex:1;min-height:40px;padding:2px}
.card.new{align-items:center;justify-content:center;min-height:210px;border-style:dashed;cursor:pointer;color:var(--mu);font-size:15px;gap:6px}.card.new b{font-size:40px;color:var(--ac);line-height:1}
.empty-t{color:var(--mu);margin:6px 0}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 28px}
select,input[type=text]{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;min-height:44px;max-width:100%}
</style><style id="hf-skin">
:root{--bg:#151816;--panel:#202523;--line:#343b37;--tx:#f1efe6;--mu:#b4bab0;--ac:#e39a7e;--ac2:#8fbf9f}
body.lt{--bg:#f3f1e8;--panel:#fbfaf4;--line:#d8d9ce;--tx:#26483e;--mu:#5a6b62;--ac:#a8512f;--ac2:#315f53}
body{font-family:"Noto Sans Thai",Sarabun,"Leelawadee UI",Thonburi,system-ui,sans-serif}
button,.b{border-radius:14px}
button.on,.b.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
h4.sh{color:var(--ac);letter-spacing:.02em}
#vp{background:#0e110f}body.lt #vp{background:#e3e2d6}
#st{border-radius:4px;box-shadow:0 12px 40px #0009}body.lt #st{box-shadow:0 10px 30px #26483e33}
body>.row:first-child{background:transparent;border-bottom:0;padding:10px 12px 6px;gap:2px}
body>.row:first-child button,body>.row:first-child a.b{background:transparent;border-color:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;min-width:44px}
body>.row:first-child button:hover,body>.row:first-child a.b:hover{background:var(--panel)}
.dock{background:var(--panel);border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px #0005}
body.lt .dock{box-shadow:0 -8px 24px #26483e1a}
.tools{gap:2px;padding:8px 8px 2px}
.t{border:0;background:transparent;color:var(--mu);border-radius:16px;min-height:56px;gap:2px}
.t b{display:flex;height:24px;align-items:center;font-size:0}
.t.on{background:var(--ac);color:var(--bg)}
#brushes{padding:8px 10px;gap:8px;border-bottom:1px solid var(--line)}
#brushes button{background:var(--bg);border-color:var(--line);border-radius:999px}
#brushes button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
#sheet,#sheet2,#sheet3,#sheet4,#sheet5{border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0}
input[type=range]{height:28px}
.fbar,#fb{border-radius:18px}
.card{border-radius:20px;box-shadow:0 8px 24px #0003}body.lt .card{box-shadow:0 8px 24px #26483e14}
.hero{border-radius:24px}
.cta{border-radius:16px}
</style></head>
<body>
<main class="wrap">
 <div class="top"><div><h1>SkillHub Studio</h1><p class="sub">แอปวาดรูปในเครื่องคุณ — ภาพทั้งหมดอยู่ในเบราว์เซอร์นี้</p></div>
 <div class="acts"><button class="b on" id="newb">＋ ผืนผ้าใหม่</button><a class="b" href="draw-studio.html#files" onclick="if(parent!==window){event.preventDefault();try{sessionStorage.setItem('shfiles','1')}catch(e){}parent.location.hash='#sh-studio'}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg> นำเข้า / สำรอง</a></div></div>
 <section class="hero" id="hero"></section>
 <h2>ผืนผ้าของฉัน</h2>
 <div class="grid" id="grid" role="list"></div>
 <div class="foot"><button id="ex">ส่งออกสถิติการฝึก</button><button id="im">นำเข้าสถิติ</button></div>
</main>
<script>/* app.js — ตัวช่วยกลางของ SkillHub Studio (ใช้ร่วมกันทั้งแกลเลอรีและสตูดิโอ)
   D = สถิติการฝึกวาด (เก็บคีย์ 'sh4' เหมือนเวอร์ชันก่อน เพื่อให้ข้อมูลเก่ายังอยู่) */
const $=id=>document.getElementById(id);
const T=()=>new Date().toLocaleDateString('sv');
let D;try{D=JSON.parse(localStorage.getItem('sh4'))}catch(e){}
D=D||{};D.min=D.min||{};D.goal=D.goal||10;D.exp=D.exp||Date.now();
const sv=()=>{try{localStorage.setItem('sh4',JSON.stringify(D))}catch(e){}};
const rl=()=>{try{const x=JSON.parse(localStorage.getItem('sh4'));if(x){D=x;D.min=D.min||{};D.goal=D.goal||10}}catch(e){}};
function streak(){let n=0,d=new Date();if(!D.min[T()])d.setDate(d.getDate()-1);while(D.min[d.toLocaleDateString('sv')]>0){n++;d.setDate(d.getDate()-1)}return n}
function toast(t){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';e.setAttribute('role','status');document.body.append(e)}e.textContent=t;e.className='s';clearTimeout(e.t);e.t=setTimeout(()=>e.className='',2200)}
function modal(h){const m=document.createElement('div');m.className='md';m.innerHTML='<div class="bx" role="dialog" aria-modal="true" tabindex="-1">'+h+'</div>';document.body.append(m);const k=e=>e.key==='Escape'&&m.close();m.close=()=>{m.remove();removeEventListener('keydown',k)};addEventListener('keydown',k);m.onclick=e=>{if(e.target==m)m.close()};m.querySelector('.bx').focus();return m}
// นับเวลาที่เปิดแอป (ทุก 5 วินาที) เฉพาะหน้าบนสุด
setInterval(()=>{if(!document.hidden){rl();D.min[T()]=(D.min[T()]||0)+5;if(window.PR)window.PR.tk+=5;sv()}},5e3);
if(window.Notification&&Notification.permission=='granted'&&new Date().getHours()>=18&&(D.min[T()]||0)<D.goal*60&&D.nt!=T()){D.nt=T();sv();try{new Notification('SkillHub Studio',{body:'วันนี้ยังไม่ถึงเป้าวาด '+D.goal+' นาที'})}catch(e){}}

</script>
<script>
const SZ=[['4:3 (1200×900)',1200,900],['จัตุรัส (1000×1000)',1000,1000],['แนวตั้ง 3:4 (900×1200)',900,1200],['A4 แนวตั้ง (990×1400)',990,1400],['16:9 (1280×720)',1280,720]];
const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(localStorage.getItem('sh4th')==='lt')document.body.classList.add('lt');
const db=new Promise(r=>{const q=indexedDB.open('sh4',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
const idb=(m,k,v)=>db.then(d=>d&&new Promise(r=>{const o=d.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k'),q=m=='get'?o.get(k):o.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}));
let DX=[];
const openDoc=id=>{try{localStorage.setItem('sh4cur',id)}catch(e){}if(parent!==window)parent.location.hash='#sh-studio';else location.href='draw-studio.html'};

function hero(){rl();const m=Math.floor((D.min[T()]||0)/60),tot=Object.values(D.min).reduce((a,b)=>a+b,0)/60|0;
$('hero').innerHTML='<div class="ring" style="--p:'+Math.min(100,m/D.goal*100)+'%" role="img" aria-label="วันนี้ '+m+' จาก '+D.goal+' นาที"><b>'+m+'</b><span>/ '+D.goal+' นาที</span></div><div class="hs"><div><b>'+streak()+'</b>วันติดต่อกัน</div><div><b>'+tot+'</b>นาทีสะสม</div><p class="goal">เป้าหมายรายวัน <input id="goal" type="number" min="1" max="240" value="'+D.goal+'" aria-label="เป้าหมายนาทีต่อวัน" style="width:72px"> นาที <button id="nt">เปิดแจ้งเตือน</button></p></div>';
$('goal').onchange=e=>{D.goal=Math.max(1,+e.target.value||10);sv();hero()};
$('nt').onclick=()=>window.Notification?Notification.requestPermission().then(p=>toast(p=='granted'?'จะเตือนหลัง 18:00 ถ้ายังไม่ถึงเป้า (ตอนเปิดแอป)':'ไม่ได้รับอนุญาต')):toast('เบราว์เซอร์ไม่รองรับ')}

function grid(){
 const list=DX.slice().sort((a,b)=>(b.t||0)-(a.t||0));
 $('grid').innerHTML='<button class="card new" id="newc" role="listitem"><b>＋</b>ผืนผ้าใหม่</button>'+list.map(d=>'<div class="card" role="listitem"><button class="th'+(d.th?'':' empty')+'" data-o="'+escH(d.id)+'" aria-label="เปิด '+escH(d.n)+'">'+(d.th?'<img src="'+d.th+'" alt="">':'')+'</button><div class="meta"><b>'+escH(d.n)+'</b><small>'+d.w+'×'+d.h+(d.bg=='t'?' · โปร่งใส':'')+(d.t?' · '+new Date(d.t).toLocaleDateString('th-TH',{day:'numeric',month:'short'}):'')+'</small></div><div class="ac"><button data-o="'+escH(d.id)+'">เปิด</button><button data-n="'+escH(d.id)+'" aria-label="เปลี่ยนชื่อ">✎</button><button data-c="'+escH(d.id)+'" aria-label="ทำสำเนา">⧉</button><button data-x="'+escH(d.id)+'" aria-label="ลบ">🗑</button></div></div>').join('');
 $('newc').onclick=newDialog;
 $('grid').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>openDoc(b.dataset.o));
 $('grid').querySelectorAll('[data-n]').forEach(b=>b.onclick=async()=>{const d=DX.find(x=>x.id==b.dataset.n),n=prompt('ชื่อผืนผ้า',d.n);if(n&&n.trim()){d.n=n.trim().slice(0,40);await idb('put','idx',DX);grid()}});
 $('grid').querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{const d=DX.find(x=>x.id==b.dataset.c),rec=await idb('get','d:'+d.id);const id='d'+Date.now();DX.push({...d,id,n:(d.n+' สำเนา').slice(0,40),t:Date.now()});if(rec)await idb('put','d:'+id,rec);await idb('put','idx',DX);grid();toast('ทำสำเนาแล้ว')});
 $('grid').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const id=b.dataset.x,d=DX.find(x=>x.id==id);if(!confirm('ลบ "'+d.n+'" ถาวร? (กู้คืนไม่ได้ ถ้าต้องการเก็บไว้ให้สำรองก่อน)'))return;
  DX=DX.filter(x=>x.id!=id);await idb('put','d:'+id,null);await idb('put','tl:'+id,null);
  const vi=(await idb('get','vi:'+id))||[];for(const v of vi)await idb('put','vd:'+id+':'+v.t,null);await idb('put','vi:'+id,null);
  await idb('put','idx',DX);grid()})}

function newDialog(){
 const m=modal('<h2>ผืนผ้าใหม่</h2><p><label>ชื่อ<br><input type="text" id="nn" maxlength="40" placeholder="ผืนผ้า '+(DX.length+1)+'" style="width:100%"></label></p><p><select id="gsz" aria-label="ขนาด">'+SZ.map((z,i)=>'<option value="'+i+'">'+z[0]+'</option>').join('')+'<option value="c">กำหนดเอง…</option></select> <span id="gcs" hidden><input id="gcw" type="number" min="64" max="4096" value="1200" aria-label="กว้าง" style="width:84px"> × <input id="gch" type="number" min="64" max="4096" value="900" aria-label="สูง" style="width:84px"></span></p><p><select id="gbg" aria-label="พื้นหลัง"><option value="w">พื้นขาว</option><option value="t">โปร่งใส</option></select></p><p><button class="b on" id="go">สร้างแล้วเริ่มวาด</button> <button class="b" id="cx">ยกเลิก</button></p>');
 $('gsz').onchange=()=>{$('gcs').hidden=$('gsz').value!='c'};$('cx').onclick=m.close;
 $('go').onclick=async()=>{let z=SZ[$('gsz').value];if($('gsz').value=='c'){const w=Math.round(+$('gcw').value),h=Math.round(+$('gch').value);if(!(w>=64&&h>=64&&w<=4096&&h<=4096))return toast('ขนาดต้องอยู่ระหว่าง 64–4096 px');if(w*h>16e6)return toast('ใหญ่เกินไป (รวมไม่เกิน 16 ล้านพิกเซล)');z=['',w,h]}
  const id='d'+Date.now();DX.push({id,n:($('nn').value.trim()||'ผืนผ้า '+(DX.length+1)).slice(0,40),w:z[1],h:z[2],bg:$('gbg').value,t:Date.now()});await idb('put','idx',DX);openDoc(id)}}

$('newb').onclick=newDialog;
$('ex').onclick=()=>{rl();D.exp=Date.now();sv();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='skillhub-stats.json';a.click()};
$('im').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const j=JSON.parse(await f.files[0].text());if(!j||typeof j!='object'||!j.min)throw 0;D=j;D.goal=D.goal||10;sv();hero();toast('นำเข้าแล้ว')}catch(e){toast('ไฟล์ไม่ถูกต้อง')}};f.click()};
async function load(){DX=(await idb('get','idx'))||[];if(!Array.isArray(DX))DX=[];hero();grid()}
load();addEventListener('pageshow',e=>{if(e.persisted)load()});
</script></body></html>
